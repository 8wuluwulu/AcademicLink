<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademicLink | Запись на занятие</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 600px; }

        header { text-align: center; margin-bottom: 32px; }

        h1 { font-size: 28px; font-weight: 800; color: var(--primary-dark); margin-bottom: 8px; }
        .tutor-name { font-size: 20px; color: var(--text-main); font-weight: 600; }

        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title span {
            background: #eef2ff;
            color: var(--primary);
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }

        .form-group { margin-bottom: 24px; }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            background-color: #fcfcfd;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .slots-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .slot-btn {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .slot-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .no-slots {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            background: #f8fafc;
            border-radius: 10px;
            border: 1px dashed var(--border);
        }

        button.submit-btn {
            width: 100%;
            background-color: var(--primary-dark);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        #status-msg {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            display: none;
        }

        .status-success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .loader {
            display: inline-block; width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%; border-top-color: #fff;
            animation: spin 1s infinite linear;
            margin-right: 10px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>AcademicLink</h1>
            <p id="tutor-display" class="tutor-name">Загрузка профиля...</p>
        </header>

        <div class="card">
            <form id="booking-form">
                <div class="section-title"><span>1</span> Выбор услуги</div>
                
                <div class="form-group">
                    <label for="service">Что бронируем?</label>
                    <select id="service" required>
                        <option value="">Выберите услугу...</option>
                    </select>
                </div>

                <div class="section-title"><span>2</span> Дата и время</div>

                <div class="form-group">
                    <label for="date">Дата занятия</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label>Доступное время</label>
                    <div id="slots-grid" class="slots-container">
                        <div class="no-slots">Сначала выберите услугу и дату</div>
                    </div>
                    <input type="hidden" id="selected-time" required>
                </div>

                <div class="section-title"><span>3</span> Контакты</div>

                <div class="form-group">
                    <label for="full-name">Ваше имя</label>
                    <input type="text" id="full-name" placeholder="Иван Иванов" required>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон для подтверждения</label>
                    <input type="tel" id="phone" placeholder="+79001234567" required>
                </div>

                <div class="form-group">
                    <label for="tg-user">Telegram @username (необязательно)</label>
                    <input type="text" id="tg-user" placeholder="john_doe">
                </div>

                <div class="form-group">
                    <label>Способ оплаты</label>
                    <div style="display: flex; gap: 20px; margin-top: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                            <input type="radio" name="pay-method" value="cash" checked style="width: auto; cursor: pointer;">
                            💵 Наличными (после занятия)
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                            <input type="radio" name="pay-method" value="transfer" style="width: auto; cursor: pointer;">
                            💳 Переводом на карту
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Записаться</button>
            </form>

            <div id="status-msg"></div>
        </div>
    </div>

    <script>
        // Extract tutor_id from URL path: /book/123
        const pathParts = window.location.pathname.split('/');
        const tutorId = pathParts[pathParts.length - 1];

        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8000/api/v1' : '/api/v1';

        const tutorDisplay = document.getElementById('tutor-display');
        const serviceSelect = document.getElementById('service');
        const dateInput = document.getElementById('date');
        const slotsGrid = document.getElementById('slots-grid');
        const selectedTimeInput = document.getElementById('selected-time');
        const statusMsg = document.getElementById('status-msg');
        const submitBtn = document.getElementById('submit-btn');

        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);
        dateInput.value = today;

        async function init() {
            if (!tutorId || isNaN(tutorId)) {
                tutorDisplay.textContent = 'Ошибка: Репетитор не найден';
                return;
            }

            try {
                // Fetch Tutor Info
                const tRes = await fetch(`${API_BASE}/tutors/${tutorId}`);
                if (!tRes.ok) throw new Error();
                const tutor = await tRes.json();
                tutorDisplay.textContent = `Репетитор: ${tutor.name}`;

                // Fetch Services
                const sRes = await fetch(`${API_BASE}/tutors/${tutorId}/services`);
                const services = await sRes.json();
                serviceSelect.innerHTML = '<option value="">Выберите услугу...</option>' + 
                    services.map(s => `<option value="${s.id}">${s.name} (${s.duration} мин) ${s.price ? '— ' + s.price + 'р' : ''}</option>`).join('');
                
            } catch (err) {
                tutorDisplay.textContent = 'Ошибка загрузки данных';
            }
        }

        async function fetchSlots() {
            const serviceId = serviceSelect.value;
            const date = dateInput.value;
            if (!serviceId || !date) return;

            slotsGrid.innerHTML = '<div class="no-slots">Загрузка...</div>';
            selectedTimeInput.value = '';

            try {
                const res = await fetch(`${API_BASE}/tutors/${tutorId}/slots?service_id=${serviceId}&date=${date}`);
                const data = await res.json();
                
                if (data.available_slots && data.available_slots.length > 0) {
                    slotsGrid.innerHTML = data.available_slots.map(slot => 
                        `<button type="button" class="slot-btn" onclick="selectSlot(this, '${slot}')">${slot}</button>`
                    ).join('');
                } else {
                    slotsGrid.innerHTML = '<div class="no-slots">Нет свободных окон</div>';
                }
            } catch (err) {
                slotsGrid.innerHTML = '<div class="no-slots">Ошибка загрузки</div>';
            }
        }

        window.selectSlot = (btn, time) => {
            document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedTimeInput.value = time;
        };

        serviceSelect.addEventListener('change', fetchSlots);
        dateInput.addEventListener('change', fetchSlots);

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const time = selectedTimeInput.value;
            if (!time) { alert('Выберите время'); return; }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span> Отправка...';

            const payload = {
                full_name: document.getElementById('full-name').value,
                phone: document.getElementById('phone').value,
                service_id: parseInt(serviceSelect.value),
                appointment_time: new Date(`${dateInput.value}T${time}`).toISOString(),
                tutor_id: parseInt(tutorId),
                telegram_username: document.getElementById('tg-user').value || null,
                payment_method: document.querySelector('input[name="pay-method"]:checked').value
            };

            try {
                const res = await fetch(`${API_BASE}/bookings/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    showStatus('✅ Вы успешно записаны!', 'success');
                    document.getElementById('booking-form').reset();
                    fetchSlots();
                } else {
                    const data = await res.json();
                    showStatus('❌ Ошибка: ' + (data.detail || 'неизвестно'), 'error');
                }
            } catch (err) {
                showStatus('❌ Ошибка сети', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Записаться';
            }
        });

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = `status-${type}`;
            statusMsg.style.display = 'block';
        }

        init();
    </script>
</body>
</html>
